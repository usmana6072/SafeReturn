[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safereturn-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "reportlab[shaping]>=4.4,<5",
    "fonttools>=4.55,<5",
    "segno>=1.6,<2",
    "svglib>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pypdf>=6,<7", "pymupdf>=1.26,<2", "zxing-cpp>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/integration"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py312"

