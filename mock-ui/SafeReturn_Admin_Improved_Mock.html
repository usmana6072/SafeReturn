  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    /* Custom scrollbar for data dense tables */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;

      display: inline-block;

            brand: {
              50: '#f0f9ff',

              500: '#0A756E',
              600: '#0A756E',
              700: '#075D57',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>

  <div id="app" class="flex flex-col h-full w-full">

  </div>

  <!-- Main JavaScript Application Logic -->
  <script>
    // --- MOCK DATABASE & INITIAL SEED DATA ---
    const INITIAL_SEED = {
      products: [
        { id: 'PROD-101', name: 'SafeReturn Medical Wristband', sku: 'SR-WB-MED-01', category: 'Wearables', status: 'published', price: 29.99, stock: 142, templateKey: 'TP-WRIST-V2', variants: ['Red/ICE', 'Blue/Medical'], updatedAt: '2026-10-18' },
        { id: 'PROD-102', name: 'Kids Safety Backpack Tag', sku: 'SR-TG-KID-02', category: 'Tags', status: 'published', price: 14.50, stock: 88, templateKey: 'TP-TAG-MINI-V1', variants: ['Neon Yellow', 'Pink'], updatedAt: '2026-10-19' },
        { id: 'PROD-103', name: 'Dementia Care QR Sticker Set (4x)', sku: 'SR-ST-DEM-04', category: 'Stickers', status: 'draft', price: 19.99, stock: 250, templateKey: 'TP-STICKER-4X', variants: ['Standard Clear'], updatedAt: '2026-10-21' }
      ],
      printTemplates: [
        { id: 'TMP-001', key: 'TP-WRIST-V2', name: 'Standard Wristband Layout', revision: 2, status: 'published', supportedTypes: ['Wristband'], size: '20mm x 200mm', lastAuthor: 'ops_lead' },
        { id: 'TMP-002', key: 'TP-TAG-MINI-V1', name: 'Compact Keyring Tag', revision: 1, status: 'published', supportedTypes: ['Tag'], size: '30mm x 30mm', lastAuthor: 'graphics_admin' },
        { id: 'TMP-003', key: 'TP-STICKER-4X', name: '4x Quad Sticker Sheet Layout', revision: 3, status: 'draft', supportedTypes: ['Sticker Sheet'], size: '100mm x 150mm', lastAuthor: 'product_team' }
      ],
      users: [
        { id: 'USR-8821', name: 'Amina Khan', email: 'amina.k@example.com', role: 'Customer', status: 'Active', qrCount: 2, registeredAt: '2026-08-12', mfaEnrolled: true },
        { id: 'USR-8822', name: 'Tariq Mahmood', email: 'tariq.m@example.com', role: 'Customer', status: 'Suspended', qrCount: 1, registeredAt: '2026-09-01', mfaEnrolled: false },
        { id: 'USR-8823', name: 'Dr. Bilal Ahmed', email: 'bilal.ahmed@clinic.pk', role: 'Customer', status: 'Active', qrCount: 5, registeredAt: '2026-09-15', mfaEnrolled: true },
        { id: 'USR-9001', name: 'Sarah Jenkins', email: 'sarah.j@safereturn.org', role: 'Operations Staff', status: 'Active', qrCount: 0, registeredAt: '2026-01-10', mfaEnrolled: true }
      ],
      qrBatches: [
        { id: 'BATCH-2026-09', size: 1000, generatedAt: '2026-10-01', status: 'QA Passed', pairsCount: 500, exported: true },
        { id: 'BATCH-2026-10', size: 500, generatedAt: '2026-10-15', status: 'In QA', pairsCount: 250, exported: false }
      ],
      orders: [
        { id: 'ORD-9021', customer: 'Amina Khan', items: 'Medical Wristband (x1)', total: 29.99, status: 'Dispatched', payment: 'Verified', date: '2026-10-18' },
        { id: 'ORD-9022', customer: 'Tariq Mahmood', items: 'Kids Backpack Tag (x2)', total: 29.00, status: 'Pending Review', payment: 'Under Review', date: '2026-10-20' },
        { id: 'ORD-9023', customer: 'Dr. Bilal Ahmed', items: 'QR Sticker Set (x2)', total: 39.98, status: 'Processing', payment: 'Verified', date: '2026-10-21' }
      ],
      auditLogs: [
        { id: 'LOG-551', timestamp: '2026-10-21 19:42:10', actor: 'security_admin', action: 'API-320 Account Suspended', target: 'USR-8822', details: 'Reason: Suspicious recovery escalation request' },
        { id: 'LOG-550', timestamp: '2026-10-21 18:15:33', actor: 'operations', action: 'API-221 Product Draft Created', target: 'PROD-103', details: 'Dementia Care QR Sticker Set created' },
        { id: 'LOG-549', timestamp: '2026-10-20 11:05:01', actor: 'finance', action: 'API-241 Payment Review Approved', target: 'ORD-9021', details: 'Settlement confirmed via manual review' }
      ]
    };

    // Upgraded mock schema version. Older localStorage seed is normalized on load.
    const MOCK_SCHEMA_VERSION = 2;
    const escapeHTML = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function normalizeData(db) {
      if (!db.products) db.products = [];
      db.products.forEach(p => {
        p.slug ??= p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
        p.description ??= '';
        p.isFeatured ??= false;
        p.featuredSortOrder ??= 0;
        p.allowsNewPair ??= true;
        p.allowsExistingQr ??= false;
        p.version ??= 1;
        p.images ??= [];
        if (!Array.isArray(p.variantRecords)) p.variantRecords = [{id:'VAR-'+p.id,sku:p.sku||'',name: Array.isArray(p.variants)?p.variants[0]||'Default':'Default',sizeMm:'35.00',material:'Vinyl',color:'',currencyCode:'PKR',unitPrice:String(p.price||0),fulfillmentMethod:'pdf_label',templateKey:p.templateKey||'',templateVersion:1,isActive:true}];
      });
      db.printTemplates ??= [];
      db.printTemplates.forEach(t=>{t.purpose ??= 'lost';t.rowVersion ??= 1;});
      return db;
    }
    // --- APPLICATION STATE ---
    let state = {
      currentPage: 'overview',
      currentRole: 'Superadmin', // Roles: Operations, Finance, Support, Security Admin, Superadmin
      data: loadStorageData(),
      sidebarCollapsed: false,
      searchQuery: '',
      modal: null, // { type: 'add_product' | 'edit_product' | 'create_template' | 'suspend_user' | 'confirm_reset' | 'qr_qa', data: {} }
      toast: null // { message, type: 'success' | 'error' | 'info' }
    };

    function loadStorageData() {
      const stored = localStorage.getItem('safereturn_demo_db');
      if (stored) {
        try {
          return normalizeData(JSON.parse(stored));
        } catch (e) {
          console.error('Failed to parse localStorage demo data', e);
        }
      }
      return normalizeData(JSON.parse(JSON.stringify(INITIAL_SEED)));
    }

    function saveStorageData() {
      localStorage.setItem('safereturn_demo_db', JSON.stringify(state.data));
    }

    function resetDemoData() {
      state.data = normalizeData(JSON.parse(JSON.stringify(INITIAL_SEED)));
      saveStorageData();
      showToast('Demo data reset to initial benchmark state!', 'info');
      render();
    }

    function showToast(message, type = 'success') {
      state.toast = { message, type };
      render();
      setTimeout(() => {
        if (state.toast && state.toast.message === message) {
          state.toast = null;
          render();
        }
      }, 3500);
    }

    function addAuditLog(action, target, details) {
      const newLog = {
        id: `LOG-${Math.floor(100 + Math.random() * 900)}`,
        timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
        actor: state.currentRole.toLowerCase().replace(' ', '_'),
        action,
        target,
        details
      };
      state.data.auditLogs.unshift(newLog);
      saveStorageData();
    }

    // --- ROLE PERMISSIONS MAP ---
    // Precise role restrictions matching the SafeReturn phase plan
    const PERMISSIONS = {
      'Operations': {
        pages: ['overview', 'products', 'templates', 'inventory', 'qr_batches', 'qa', 'orders', 'print_jobs', 'shipments', 'notifications', 'monitoring'],
        canEditCatalog: true,
        canCreateTemplates: true,
        canSuspendUser: false,
        canApprovePayment: false,
        canManagePermissions: false
      },
      'Finance': {
        pages: ['overview', 'orders', 'payments', 'finance_sync', 'audit'],
        canEditCatalog: false,
        canCreateTemplates: false,
        canSuspendUser: false,
        canApprovePayment: true,
        canManagePermissions: false
      },
      'Support': {
        pages: ['overview', 'users', 'orders', 'support', 'notifications'],
        canEditCatalog: false,
        canCreateTemplates: false,
        canSuspendUser: false,
        canApprovePayment: false,
        canManagePermissions: false
      },
      'Security Admin': {
        pages: ['overview', 'users', 'staff_permissions', 'privacy_requests', 'storage', 'audit', 'monitoring'],
        canEditCatalog: false,
        canCreateTemplates: false,
        canSuspendUser: true,
        canApprovePayment: false,
        canManagePermissions: true
      },
      'Superadmin': {
        pages: ['overview', 'products', 'templates', 'users', 'staff_permissions', 'inventory', 'qr_batches', 'qa', 'orders', 'payments', 'print_jobs', 'shipments', 'notifications', 'support', 'privacy_requests', 'finance_sync', 'storage', 'audit', 'monitoring'],
        canEditCatalog: true,
        canCreateTemplates: true,
        canSuspendUser: true,
        canApprovePayment: true,
        canManagePermissions: true
      }
    };

    function isRoleAllowed(pageName) {
      const allowedPages = PERMISSIONS[state.currentRole]?.pages || [];
      return allowedPages.includes(pageName);
    }

    // --- UI ROUTING & NAVIGATION ---
    function navigateTo(page) {
      if (!isRoleAllowed(page)) {
        showToast(`Page '${page}' is restricted for the '${state.currentRole}' role.`, 'error');
        return;
      }
      state.currentPage = page;
      state.searchQuery = '';
      render();
    }

    // --- RENDER ENGINE ---
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      // Ensure current page is allowed for active role
      if (!isRoleAllowed(state.currentPage)) {
        state.currentPage = PERMISSIONS[state.currentRole].pages[0] || 'overview';
      }

      appEl.innerHTML = `
        <div class="flex h-full w-full overflow-hidden">
          ${renderSidebar()}
          <div class="flex flex-col flex-1 h-full min-w-0 overflow-hidden">
            ${renderHeader()}
            <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50">
              ${renderCurrentPage()}
            </main>
          </div>
        </div>
        ${renderModal()}
        ${renderToast()}
      `;

      // Re-initialize Lucide Icons
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // --- COMPONENT: SIDEBAR ---
    function renderSidebar() {
      const allowed = PERMISSIONS[state.currentRole]?.pages || [];
      const menuItems = [
        { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
        { id: 'products', label: 'Products (API-220)', icon: 'package' },
        { id: 'templates', label: 'Print Templates (API-300)', icon: 'printer' },
        { id: 'users', label: 'Users & Accounts (API-320)', icon: 'users' },
        { id: 'staff_permissions', label: 'Staff Permissions', icon: 'shield-check' },
        { id: 'inventory', label: 'Inventory Management', icon: 'boxes' },
        { id: 'qr_batches', label: 'QR Batches', icon: 'qr-code' },
        { id: 'qa', label: 'QR Quality Assurance', icon: 'check-circle-2' },
        { id: 'orders', label: 'Orders & Sales', icon: 'shopping-cart' },
        { id: 'payments', label: 'Payments & Reconciliation', icon: 'credit-card' },
        { id: 'print_jobs', label: 'Print Jobs Queue', icon: 'file-text' },
        { id: 'shipments', label: 'Shipments & Logistics', icon: 'truck' },
        { id: 'notifications', label: 'Notification Queue', icon: 'bell' },
        { id: 'support', label: 'Support Cases', icon: 'life-buoy' },
        { id: 'privacy_requests', label: 'Privacy Requests', icon: 'file-lock-2' },
        { id: 'finance_sync', label: 'Finance Mirror Sync', icon: 'refresh-cw' },
        { id: 'storage', label: 'Storage & Retention', icon: 'hard-drive' },
        { id: 'audit', label: 'Audit Logs', icon: 'file-spreadsheet' },
        { id: 'monitoring', label: 'System Health', icon: 'activity' }
      ];

      return `
        <aside class="bg-slate-900 text-slate-300 ${state.sidebarCollapsed ? 'w-16' : 'w-64'} transition-all duration-200 flex flex-col h-full z-20 border-r border-slate-800">
          <!-- Logo Header -->
          <div class="h-14 flex items-center justify-between px-4 border-b border-slate-800 text-white">
            <div class="flex items-center space-x-2 font-bold text-base truncate ${state.sidebarCollapsed ? 'hidden' : 'flex'}">
              <span class="bg-sky-500 text-white p-1.5 rounded-lg">
                <i data-lucide="shield" class="w-4 h-4"></i>
              </span>
              <span class="tracking-tight">SafeReturn <span class="text-xs font-normal text-sky-400">ADMIN</span></span>
            </div>
            <button onclick="state.sidebarCollapsed = !state.sidebarCollapsed; render();" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white">
              <i data-lucide="${state.sidebarCollapsed ? 'chevron-right' : 'chevron-left'}" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Navigation Links -->
          <nav class="flex-1 overflow-y-auto p-2 space-y-1">
            ${menuItems.map(item => {
              const isAllowed = allowed.includes(item.id);
              if (!isAllowed) return ''; // Hide forbidden navigation items per requirements
              const isActive = state.currentPage === item.id;
              return `
                <button onclick="navigateTo('${item.id}')" 
                  class="w-full flex items-center ${state.sidebarCollapsed ? 'justify-center' : 'justify-start px-3'} py-2 rounded-lg text-xs font-medium transition-colors ${isActive ? 'bg-sky-600 text-white font-semibold' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}">
                  <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${isActive ? 'text-white' : 'text-slate-400'}"></i>
                  ${!state.sidebarCollapsed ? `<span class="ml-3 truncate">${item.label}</span>` : ''}
                </button>
              `;
            }).join('')}
          </nav>

          <!-- Footer Action -->
          <div class="p-3 border-t border-slate-800">
            <button onclick="state.modal = { type: 'confirm_reset' }; render();" class="w-full flex items-center ${state.sidebarCollapsed ? 'justify-center' : 'justify-start px-3'} py-2 rounded-lg text-xs font-medium bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-800/50 transition-colors">
              <i data-lucide="rotate-ccw" class="w-4 h-4 shrink-0 text-red-400"></i>
              ${!state.sidebarCollapsed ? `<span class="ml-2.5">Reset Demo Data</span>` : ''}
            </button>
          </div>
        </aside>
      `;
    }

    // --- COMPONENT: HEADER ---
    function renderHeader() {
      return `
        <header class="h-14 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center justify-between z-10">
          <div class="flex items-center space-x-3">
            <h1 class="font-semibold text-slate-800 text-sm md:text-base capitalize">
              ${state.currentPage.replace('_', ' ')}
            </h1>
            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200 font-mono hidden sm:inline-block">
              Mock Storage: ${state.data.products.length} Products | ${state.data.users.length} Users
            </span>
          </div>

          <!-- Role Switcher & User Control -->
          <div class="flex items-center space-x-3">
            <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
              <span class="text-xs text-slate-500 font-medium px-2 hidden lg:inline">Role View:</span>
              <select onchange="state.currentRole = this.value; render();" class="bg-white text-slate-800 text-xs font-semibold rounded px-2 py-1 border border-slate-200 focus:outline-none focus:ring-1 focus:ring-sky-500">
                <option value="Superadmin" ${state.currentRole === 'Superadmin' ? 'selected' : ''}>Superadmin</option>
                <option value="Operations" ${state.currentRole === 'Operations' ? 'selected' : ''}>Operations</option>
                <option value="Finance" ${state.currentRole === 'Finance' ? 'selected' : ''}>Finance</option>
                <option value="Support" ${state.currentRole === 'Support' ? 'selected' : ''}>Support</option>
                <option value="Security Admin" ${state.currentRole === 'Security Admin' ? 'selected' : ''}>Security Admin</option>
              </select>
            </div>

            <div class="h-6 w-px bg-slate-200"></div>

            <div class="flex items-center space-x-2">
              <div class="w-7 h-7 rounded-full bg-sky-600 text-white flex items-center justify-center font-bold text-xs">
                ${state.currentRole.charAt(0)}
              </div>
              <span class="text-xs font-medium text-slate-700 hidden sm:inline">${state.currentRole} User</span>
            </div>
          </div>
        </header>
      `;
    }

    // --- PAGE CONTROLLER ROUTER ---
    function renderCurrentPage() {
      switch (state.currentPage) {
        case 'overview': return renderOverviewPage();
        case 'products': return renderProductsPage();
        case 'templates': return renderPrintTemplatesPage();
        case 'users': return renderUsersPage();
        case 'staff_permissions': return renderStaffPermissionsPage();
        case 'inventory': return renderInventoryPage();
        case 'qr_batches': return renderQRBatchesPage();
        case 'qa': return renderQAPage();
        case 'orders': return renderOrdersPage();
        case 'payments': return renderPaymentsPage();
        case 'audit': return renderAuditPage();
        default: return renderGenericModulePage(state.currentPage);
      }
    }

    // --- PAGE 1: OVERVIEW PAGE ---
    function renderOverviewPage() {
      const prodCount = state.data.products.length;
      const userCount = state.data.users.length;
      const orderCount = state.data.orders.length;
      const templateCount = state.data.printTemplates.length;

      return `
        <div class="space-y-6">
          <!-- Notice Banner -->
          <div class="bg-sky-50 border border-sky-200 rounded-xl p-4 flex items-start space-x-3">
            <i data-lucide="info" class="w-5 h-5 text-sky-600 shrink-0 mt-0.5"></i>
            <div class="text-xs text-sky-900">
              <span class="font-semibold">Browser-Testable SafeReturn Admin Prototype Active:</span>
              Changes will persist in your browser's <code class="bg-sky-100 px-1 py-0.5 rounded text-sky-800">localStorage</code>. 
              Switch roles in the top bar to preview access restrictions. Use the <span class="font-semibold">Reset Demo Data</span> button anytime.
            </div>
          </div>

          <!-- Key Metrics Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p class="text-xs font-medium text-slate-500">Managed Products</p>
                <p class="text-2xl font-bold text-slate-900 mt-1">${prodCount}</p>
                <p class="text-[11px] text-emerald-600 mt-1">API-220 Catalog synced</p>
              </div>
              <div class="p-3 bg-sky-50 text-sky-600 rounded-lg">
                <i data-lucide="package" class="w-6 h-6"></i>
              </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p class="text-xs font-medium text-slate-500">Print Template Revisions</p>
                <p class="text-2xl font-bold text-slate-900 mt-1">${templateCount}</p>
                <p class="text-[11px] text-sky-600 mt-1">API-300 Templates ready</p>
              </div>
              <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg">
                <i data-lucide="printer" class="w-6 h-6"></i>
              </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p class="text-xs font-medium text-slate-500">Registered Accounts</p>
                <p class="text-2xl font-bold text-slate-900 mt-1">${userCount}</p>
                <p class="text-[11px] text-amber-600 mt-1">API-320 Lifecycle guarded</p>
              </div>
              <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
                <i data-lucide="users" class="w-6 h-6"></i>
              </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p class="text-xs font-medium text-slate-500">Total Active Orders</p>
                <p class="text-2xl font-bold text-slate-900 mt-1">${orderCount}</p>
                <p class="text-[11px] text-emerald-600 mt-1">Settlements verified</p>
              </div>
              <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
                <i data-lucide="shopping-bag" class="w-6 h-6"></i>
              </div>
            </div>
          </div>

          <!-- Quick Interactive Workflows Section -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Recent Audit Events -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
              <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
                <h3 class="font-semibold text-slate-800 text-sm flex items-center">
                  <i data-lucide="activity" class="w-4 h-4 mr-2 text-sky-600"></i> Recent Audit Log Activity
                </h3>
                <button onclick="navigateTo('audit')" class="text-xs text-sky-600 hover:underline">View All</button>
              </div>
              <div class="space-y-2">
                ${state.data.auditLogs.slice(0, 4).map(log => `
                  <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-100 text-xs flex justify-between items-start">
                    <div>
                      <span class="font-semibold text-slate-800">${log.action}</span>
                      <p class="text-slate-500 text-[11px] mt-0.5">${log.details}</p>
                    </div>
                    <span class="text-[10px] text-slate-400 shrink-0 font-mono">${log.timestamp.split(' ')[1]}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Role Capability Matrix Interactive Card -->

    function restoreUser(id) {
      const user = state.data.users.find(u => u.id === id);
      if (user) {

        addAuditLog('API-321 Account Restored', id, 'Account un-suspended via governance action');
        saveStorageData();
        showToast(`User ${user.name} has been restored.`);
        render();

      addAuditLog('API-322 Recovery Escalation', id, 'Case referral logged for security review');
      showToast(`Recovery escalated for ${id}. Audit record generated.`, 'info');

    // --- MODAL FORM HANDLERS ---
    function editorField(label,id,value,type='text',placeholder='') {return `<div><label for="${id}" class="block mb-1 font-medium text-xs">${label}</label><input id="${id}" type="${type}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}" ${label.includes('*')?'required':''} class="sr-input" /></div>`;}
    let variantSequence = 0;
    function variantRowHTML(v={},i=0) {
      const n = ++variantSequence;
      return `<div class="variant-row border bg-slate-50/70 rounded-xl p-3 space-y-3" data-id="${escapeHTML(v.id||'')}"><div class="flex justify-between items-center"><b class="text-xs">Variant ${i+1}</b><button type="button" class="text-xs text-red-700 hover:underline" onclick="this.closest('.variant-row').remove()">Remove</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
      ${variantInput('Variant name *','name',v.name||'',true)}${variantInput('SKU *','sku',v.sku||'',true)}${variantInput('Size (mm) *','sizeMm',v.sizeMm||'35.00',true)}${variantInput('Material','material',v.material||'')}${variantInput('Color','color',v.color||'')}${variantInput('Unit price (PKR) *','unitPrice',v.unitPrice||'',true)}
      <label class="text-xs font-medium">Fulfillment method<select data-v="fulfillmentMethod" class="sr-input mt-1">${['pdf_label','manufacturer_artwork','manual'].map(x=>`<option ${v.fulfillmentMethod===x?'selected':''}>${x}</option>`).join('')}</select></label>
      ${variantInput('Template key','templateKey',v.templateKey||'')}${variantInput('Template version *','templateVersion',v.templateVersion||1,true)}
      </div><label class="flex gap-2 items-center text-xs"><input type="checkbox" data-v="isActive" ${v.isActive!==false?'checked':''}> Active variant</label><p class="text-[11px] text-slate-500">Variant ${n} · price and template frozen on historical orders</p></div>`;
    }
    function variantInput(label,key,val,required=false){return `<label class="text-xs font-medium">${label}<input data-v="${key}" value="${escapeHTML(val)}" ${required?'required':''} class="sr-input mt-1" /></label>`;}
    function imageRowHTML(im={}) {return `<div class="image-row grid sm:grid-cols-[2fr_2fr_60px_auto] items-end gap-2 bg-slate-50 border rounded-lg p-3">${variantInput('Cloudinary public_id','publicId',im.publicId||'')}${variantInput('Alt text','alt',im.alt||'')}${variantInput('Order','sortOrder',im.sortOrder??0)}<div class="flex items-center gap-3 pb-2"><label class="text-xs flex gap-1"><input type="checkbox" data-v="primary" ${im.primary?'checked':''}>Primary</label><button type="button" onclick="this.closest('.image-row').remove()" class="text-xs text-red-700">Remove</button></div></div>`;}
    function appendVariantRow(){const el=document.getElementById('variant-rows');el.insertAdjacentHTML('beforeend',variantRowHTML({isActive:true,fulfillmentMethod:'pdf_label'},el.children.length));}
    function appendImageRow(){document.getElementById('product-image-rows').insertAdjacentHTML('beforeend',imageRowHTML());}
    function readRows(selector){return [...document.querySelectorAll(selector)].map(row=>{const obj={id:row.dataset.id||undefined};row.querySelectorAll('[data-v]').forEach(input=>obj[input.dataset.v]=input.type==='checkbox'?input.checked:input.value.trim());return obj;});}
    function saveDetailedProduct(e,id){
      e.preventDefault();
      const el=x=>document.getElementById(x);
      const name=el('prod_name').value.trim(),slug=el('prod_slug').value.trim().toLowerCase(),category=el('prod_cat').value;
      const variants=readRows('.variant-row'); const images=readRows('.image-row');
      if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))return showToast('Slug must use lowercase letters, numbers and hyphens.','error');
      if(state.data.products.some(p=>p.id!==id&&p.slug===slug))return showToast('This product slug is already used.','error');
      const skuSet=new Set();
      for(const v of variants){
        if(!v.sku||skuSet.has(v.sku)||state.data.products.some(p=>p.id!==id&&(p.variantRecords||[]).some(a=>a.sku===v.sku))) return showToast('Every variant needs a globally unique SKU.','error');
        skuSet.add(v.sku);
        if(!/^\d+(?:\.\d{1,2})?$/.test(v.unitPrice)||Number(v.unitPrice)<0)return showToast('Variant prices must be nonnegative PKR decimals.','error');
        if(!/^\d+(?:\.\d{1,2})?$/.test(v.sizeMm)||Number(v.sizeMm)<=0)return showToast('Each variant needs a positive millimeter size.','error');
        if(!Number.isInteger(Number(v.templateVersion))||Number(v.templateVersion)<1)return showToast('Template version must be a positive integer.','error');
      }
      if(images.some(im=>im.publicId&&!im.alt))return showToast('Every referenced public image requires alt text.','error');
      const requested=el('prod_status').value;
      if(requested==='published')return showToast('Publishing is gated: independently approved images, physical QA, template revision and P0 policy cannot be verified in this browser mock. Saved draft instead.','error');
      if(category!=='Stickers'&&requested==='published')return showToast('Non-sticker product launch is gated.','error');
      const p=id?state.data.products.find(x=>x.id===id):{id:`PROD-${Date.now()}`,version:0}; if(!p)return;
      Object.assign(p,{name,slug,description:el('prod_description').value.trim(),category,isFeatured:el('prod_featured').checked,featuredSortOrder:Number(el('prod_featured_order').value)||0,allowsNewPair:el('prod_new_pair').checked,allowsExistingQr:el('prod_reuse').checked,status:requested,variantRecords:variants.map((v,i)=>({...v,id:v.id||`VAR-${Date.now()}-${i}`,currencyCode:'PKR',templateVersion:Number(v.templateVersion)})),images:images.filter(im=>im.publicId),updatedAt:new Date().toISOString().slice(0,10),version:p.version+1});
      p.sku=p.variantRecords[0]?.sku||'—';p.price=p.variantRecords[0]?.unitPrice||'0.00';p.templateKey=p.variantRecords[0]?.templateKey||'—';p.variants=p.variantRecords.map(v=>v.name);p.stock??=0;
      if(!id)state.data.products.unshift(p);
      addAuditLog(id?'API-222 Product Draft Updated':'API-221 Product Draft Created',p.id,`Mock draft ${p.slug}, ${variants.length} variants`);
      saveStorageData();state.modal=null;showToast('Product draft saved in browser demo.');render();
    }
    function handleCreateTemplateSubmit(e){
      e.preventDefault();const key=document.getElementById('m_tmpl_key').value,name=document.getElementById('m_tmpl_name').value.trim(),purpose=document.getElementById('m_tmpl_purpose').value;
      if(!/^[A-Za-z0-9._-]{3,80}$/.test(key)||name.length<1||name.length>100)return showToast('Invalid key or name; check API-301 constraints.','error');
      if(state.data.printTemplates.some(t=>t.key===key))return showToast('Template key already exists.','error');
      const t={id:`TMP-${Date.now()}`,key,name,purpose,revision:0,rowVersion:1,status:'draft',supportedTypes:['Sticker'],size:'Not configured — create revision',lastAuthor:state.currentRole.toLowerCase()};
      state.data.printTemplates.unshift(t);addAuditLog('API-301 Template Key Created',key,'Draft key only; no renderer or physical QA');saveStorageData();state.modal=null;showToast('Draft template key created. Revision and QA still required.');render();
    }
    function confirmSuspendUser(id) {
      const user=state.data.users.find(u=>u.id===id);if(!user)return;
      const caseId=document.getElementById('m_suspend_case')?.value.trim(),rev=Number(document.getElementById('m_suspend_revision')?.value),code=document.getElementById('m_suspend_reason_code')?.value,confirmed=document.getElementById('m_suspend_confirm')?.checked;
      if(!caseId||!Number.isInteger(rev)||rev<1||!code||!confirmed)return showToast('Case, expected revision, reason code and confirmation are required.','error');
      if(rev!==(user.revision||1))return showToast('Stale account revision; refresh the record and try again.','error');
      user.status='Suspended';user.revision=rev+1;addAuditLog('API-320 Mock Account Suspension',id,`Case ${caseId}; reason code ${code}; no real session invalidation`);
      saveStorageData();state.modal=null;showToast('Mock account suspended. No real authorization, session invalidation or backend action occurred.');render();
    }

    // --- COMPONENT: TOAST NOTIFICATIONS ---
    function renderToast() {
      if (!state.toast) return '';
      const isError = state.toast.type === 'error';
      const isInfo = state.toast.type === 'info';

      return `
        <div class="fixed bottom-5 right-5 z-50 flex items-center space-x-2 px-4 py-3 rounded-lg shadow-lg border text-xs font-semibold ${
          isError ? 'bg-red-900 text-white border-red-700' : isInfo ? 'bg-sky-900 text-white border-sky-700' : 'bg-emerald-900 text-white border-emerald-700'
        }">
          <i data-lucide="${isError ? 'alert-circle' : isInfo ? 'info' : 'check-circle'}" class="w-4 h-4 shrink-0"></i>
          <span>${state.toast.message}</span>
        </div>
      `;
    }

    // --- APP INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
